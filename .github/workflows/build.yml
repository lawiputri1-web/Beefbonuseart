
name: Build BeefBonus

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source if uploaded as ZIP
        run: |
          if [ -f BeefBonus-Fabric-1.21.1-source.zip ]; then
            unzip -q BeefBonus-Fabric-1.21.1-source.zip
          fi

      - name: Build mod
        run: |
          if [ -d BeefBonus-Fabric ]; then
            cd BeefBonus-Fabric
          fi
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BeefBonus-Fabric-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
